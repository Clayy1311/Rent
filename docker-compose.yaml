version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: azka_db_mysql
    restart: always
    environment:
      MYSQL_DATABASE: azka_outdoor_db
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3307:3306"  # <--- Ubah bagian ini
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data: